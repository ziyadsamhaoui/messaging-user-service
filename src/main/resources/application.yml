spring:
  application:
    name: messaging-user-service
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:user_db}
    username: ${DB_USER:user_service}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8082

badrlink:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    outbox:
      relay-interval: ${KAFKA_RELAY_INTERVAL:500ms}
      batch-size: ${KAFKA_RELAY_BATCH:100}
      topic: badrlink.user.profile.v1
  security:
    jwt:
      jwk-set-uri: ${JWT_JWK_SET_URI:http://messaging-auth-service:8081/oauth2/jwks}
      hmac-secret: ${JWT_HMAC_SECRET:}
    internal:
      hmac-secret: ${INTERNAL_HMAC_SECRET}
    auth-service:
      base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
